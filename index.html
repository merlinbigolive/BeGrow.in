<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merlin Agency</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#070707;color:#fff}
section{padding:55px 20px;max-width:1150px;margin:auto}
h1,h2{margin-top:0}
.video-wrap{position:relative;overflow:hidden}
.video-track{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:12px 4px 25px;scrollbar-width:none}
.video-track::-webkit-scrollbar{display:none}
.video-card{flex:0 0 190px;height:338px;border-radius:18px;overflow:hidden;background:#151515;scroll-snap-align:center;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.video-card video{width:100%;height:100%;object-fit:cover;display:block}
.placeholder{display:flex;align-items:center;justify-content:center;text-align:center;color:#aaa;border:1px dashed #555}
.video-btn{position:absolute;top:45%;z-index:3;border:0;border-radius:50%;width:42px;height:42px;background:#fff;color:#000;font-size:22px;cursor:pointer}
.prev{left:5px} .next{right:5px}
form{max-width:600px;margin:auto;display:grid;gap:14px}
input,select,textarea{width:100%;padding:14px;border-radius:10px;border:1px solid #444;background:#151515;color:#fff}
button.submit{padding:14px;border:0;border-radius:10px;background:#fff;color:#000;font-weight:700;cursor:pointer}
.label{font-size:14px;color:#ccc;margin-bottom:-7px}
.hero{text-align:center;padding:90px 20px 45px}
.hero p{color:#bbb;max-width:650px;margin:15px auto}
</style>
</head>
<body>
<header class="hero">
<h1>Merlin Agency</h1>
<p>Join our creator network and start your live streaming journey.</p>
</header>

<section>
<h2>Meet Our Creators</h2>
<div class="video-wrap">
<button class="video-btn prev" onclick="slide(-1)">‹</button>
<div class="video-track" id="videoTrack">
<div class="video-card"><video src="videos/video1.mp4" autoplay muted loop playsinline controls></video></div>
<div class="video-card"><video src="videos/video2.mp4" autoplay muted loop playsinline controls></video></div>
<div class="video-card placeholder"><div>Video 3<br><small>Add video3.mp4</small></div></div>
<div class="video-card placeholder"><div>Video 4<br><small>Add video4.mp4</small></div></div>
<div class="video-card placeholder"><div>Video 5<br><small>Add video5.mp4</small></div></div>
</div>
<button class="video-btn next" onclick="slide(1)">›</button>
</div>
</section>

<section id="apply">
<h2>Apply Now</h2>
<form>
<input type="text" placeholder="Full Name" required>
<input type="tel" placeholder="Contact Number" required>
<input type="email" placeholder="Email Address" required>
<div class="label">BIGO ID (OPTIONAL)</div>
<input type="text" placeholder="BIGO ID (Optional)">
<select required>
<option value="">Select your talent</option>
<option>Model</option><option>Singer</option><option>Dancer</option>
<option>Comedian</option><option>Artist</option><option>Entertainer</option>
</select>
<textarea rows="4" placeholder="Tell us about yourself"></textarea>
<button class="submit" type="submit">Submit Application</button>
</form>
</section>

<script>
const track=document.getElementById('videoTrack');
function slide(dir){
  track.scrollBy({left:dir*225,behavior:'smooth'});
}
setInterval(()=>{
  if(track.scrollLeft + track.clientWidth >= track.scrollWidth-10) {
    track.scrollTo({left:0,behavior:'smooth'});
  } else {
    slide(1);
  }
},3500);
</script>
</body>
</html>
