<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06110b"><title>Merlin Agency | Admin</title><style>
:root{--bg:#020705;--p:#07120c;--g:#19f08a;--g2:#9bffc9;--t:#f1f8f3;--m:#8fa197;--l:rgba(141,255,194,.16)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0%,rgba(25,240,138,.09),transparent 30%),var(--bg);color:var(--t);font-family:Arial,sans-serif;min-height:100vh}button,input{font:inherit}.wrap{width:min(1180px,calc(100% - 24px));margin:auto}.login{max-width:420px;margin:8vh auto;padding:28px;border:1px solid var(--l);border-radius:24px;background:linear-gradient(145deg,rgba(12,37,24,.9),rgba(4,11,7,.96));box-shadow:0 24px 80px #0007}.brand{display:flex;align-items:center;gap:10px}.mark{width:40px;height:40px;border:1px solid var(--g);border-radius:11px;display:grid;place-items:center;color:var(--g);font:23px Georgia}.brand b{display:block;letter-spacing:.14em;font:700 14px Georgia}.brand small{color:#769082;letter-spacing:.2em;font-size:7px}h1,h2{font-family:Georgia,serif}.login h1{margin:22px 0 8px;font-size:34px}.login p{color:var(--m);font-size:12px;line-height:1.6}.field{margin:14px 0}.field label{display:block;color:#a9b9af;font-size:10px;font-weight:800;margin-bottom:6px}.field input{width:100%;background:#020805;border:1px solid var(--l);border-radius:12px;padding:13px;color:white;outline:0}.primary{width:100%;border:0;border-radius:12px;padding:14px;background:var(--g);color:#031108;font-weight:900;cursor:pointer}.primary:disabled{opacity:.6}.error{display:none;color:#ffb0b0;font-size:11px;line-height:1.6;margin-top:12px;padding:11px;border-radius:10px;background:#ff505012;border:1px solid #ff78782f;word-break:break-word}.error.show{display:block}.status{font-size:10px;color:var(--m);margin-top:10px}.status.ok{color:var(--g2)}.dashboard{display:none}.dashboard.open{display:block}.top{padding:16px 0;border-bottom:1px solid var(--l)}.topi{display:flex;justify-content:space-between;align-items:center}.logout{background:transparent;border:1px solid var(--l);color:var(--g2);padding:9px 13px;border-radius:999px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.stat,.panel{border:1px solid var(--l);border-radius:16px;background:rgba(7,18,12,.85)}.stat{padding:16px}.stat small{display:block;color:var(--m);font-size:9px}.stat b{display:block;color:var(--g);font-size:25px;margin-top:5px}.layout{display:grid;grid-template-columns:380px minmax(0,1fr);gap:14px}.panel{border-radius:20px;overflow:hidden}.ph{padding:15px 17px;border-bottom:1px solid var(--l);font-weight:900}.apps{max-height:650px;overflow:auto}.app{padding:15px 17px;border-bottom:1px solid #8dffc20f;cursor:pointer}.app:hover,.app.active{background:#19f08a12}.app b{font-size:13px}.app small{display:block;color:var(--m);margin-top:5px;font-size:10px}.tag{display:inline-block;margin-top:7px;color:var(--g2);font-size:9px;border:1px solid var(--l);padding:4px 7px;border-radius:999px}.empty{padding:25px;color:var(--m);font-size:12px}.detail{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.info{background:#020805;border:1px solid #8dffc20f;border-radius:12px;padding:11px}.info small{display:block;color:#6f8177;font-size:8px;text-transform:uppercase}.info b{display:block;font-size:11px;margin-top:4px;word-break:break-word}.phone{color:var(--g2);font-size:11px}.msgbox{margin:12px 0;padding:12px;border-radius:12px;background:#19f08a0d;border:1px solid var(--l);color:#b8c8bf;font-size:11px;line-height:1.5}.chat{border-top:1px solid var(--l);margin:18px -18px -18px}.messages{height:340px;overflow:auto;padding:15px}.msg{max-width:82%;padding:10px 12px;border-radius:14px;margin-bottom:9px;font-size:12px;line-height:1.45;white-space:pre-wrap}.user{margin-left:auto;background:var(--g);color:#031108}.agency{background:#0b1a11;border:1px solid var(--l)}.send{display:flex;gap:8px;padding:12px;border-top:1px solid var(--l)}.send input{flex:1;min-width:0;background:#020805;border:1px solid var(--l);border-radius:11px;padding:12px;color:white;outline:0}.send button{border:0;border-radius:11px;background:var(--g);color:#031108;font-weight:900;padding:0 18px}@media(max-width:850px){.layout{grid-template-columns:1fr}.apps{max-height:360px}}@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.login{margin:7vh auto}}
</style></head><body>
<div id="login" class="wrap login"><div class="brand"><span class="mark">M</span><span><b>MERLIN</b><small>AGENCY ADMIN</small></span></div><h1>Admin Login</h1><p>Private dashboard for Merlin Agency applications and live chat.</p><div class="field"><label>ADMIN EMAIL</label><input id="email" type="email" autocomplete="username" placeholder="admin@email.com"></div><div class="field"><label>PASSWORD</label><input id="pass" type="password" autocomplete="current-password" placeholder="Your password"></div><button id="loginBtn" class="primary" type="button">Login to Admin Panel</button><div id="err" class="error"></div><div id="status" class="status">Connecting to Firebase…</div></div>
<div id="dash" class="dashboard"><header class="top"><div class="wrap topi"><div class="brand"><span class="mark">M</span><span><b>MERLIN</b><small>AGENCY ADMIN</small></span></div><button id="logout" class="logout">Logout</button></div></header><main class="wrap"><div class="stats"><div class="stat"><small>APPLICATIONS</small><b id="ac">0</b></div><div class="stat"><small>MESSAGES</small><b id="mc">0</b></div><div class="stat"><small>SELECTED</small><b id="sel">—</b></div></div><div class="layout"><section class="panel"><div class="ph">📨 Applications</div><div id="apps" class="apps"><div class="empty">Loading applications…</div></div></section><section class="panel"><div id="detail" class="detail"><div class="empty">Select an application to view details and live chat.</div></div></section></div></main></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getDatabase,ref,onValue,onChildAdded,push,off}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const config={apiKey:"AIzaSyCnwNpsliuNJdgSoWFxP0Axqh5P8yVisKA",authDomain:"merlin-live-chat.firebaseapp.com",databaseURL:"https://merlin-live-chat-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"merlin-live-chat",storageBucket:"merlin-live-chat.firebasestorage.app",messagingSenderId:"660028612124",appId:"1:660028612124:web:37060b488ed47a0e6889d9",measurementId:"G-3KHQQ75V6D"};
const $=id=>document.getElementById(id);let db,auth,apps={},selected=null,msgRef=null,started=false;const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
try{
const app=initializeApp(config);
db=getDatabase(app);
auth=getAuth(app);
$('status').textContent='Firebase connected';
$('status').className='status ok'
}catch(e){
$('status').textContent='Firebase setup error';
$('status').className='status';
showErr('Firebase configuration error: '+(e.message||e))
}
function showErr(x){$('err').innerHTML='<b>Login failed</b><br>'+esc(x);$('err').classList.add('show')}
function loginUI(){ $('login').style.display='block';$('dash').classList.remove('open') }function dashUI(){ $('login').style.display='none';$('dash').classList.add('open') }
$('loginBtn').onclick=async()=>{
$('err').classList.remove('show');
let e=$('email').value.trim(),p=$('pass').value;
if(!e||!p){showErr('Please enter both email and password.');return}
if(!auth){showErr('Firebase Auth initialize nahi hua. Firebase Web App config me valid apiKey lagani hogi.');return}
$('loginBtn').disabled=true;
$('loginBtn').textContent='Signing in…';
try{
await signInWithEmailAndPassword(auth,e,p)
}catch(x){
let m=x.message||'Login failed';
if(x.code==='auth/api-key-not-valid'||x.code==='auth/api-key-not-valid.-please-pass-a-valid-api-key.'){
m='Firebase API key invalid/rejected hai. Is admin.html me jo apiKey hai, Firebase Project Settings → Your apps → Web app se latest config ka apiKey replace karna zaroori hai.'
}else if(x.code==='auth/invalid-credential'||x.code==='auth/wrong-password'){
m='Email ya password galat hai.'
}else if(x.code==='auth/user-not-found'){
m='Is email ka Firebase user nahi mila.'
}else if(x.code==='auth/operation-not-allowed'){
m='Firebase Authentication me Email/Password enable nahi hai.'
}
showErr(m+' ('+(x.code||'unknown')+')')
}finally{
$('loginBtn').disabled=false;
$('loginBtn').textContent='Login to Admin Panel'
}};
$('pass').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{if(u){dashUI();start()}else loginUI()});
function start(){if(started)return;started=true;onValue(ref(db,'applications'),s=>{apps=s.val()||{};let ids=Object.keys(apps).sort((a,b)=>(apps[b]?.createdAt||0)-(apps[a]?.createdAt||0));$('ac').textContent=ids.length;if(!ids.length){$('apps').innerHTML='<div class="empty">No applications yet.</div>';return}$('apps').innerHTML=ids.map(id=>{let a=apps[id]||{};return`<div class="app ${id===selected?'active':''}" data-id="${esc(id)}"><b>${esc(a.name||'Unknown applicant')}</b><small>📍 ${esc(a.location||'—')} · 📱 ${esc(a.phone||'—')}</small><span class="tag">${esc(a.target||'No target')}</span></div>`}).join('');document.querySelectorAll('.app').forEach(x=>x.onclick=()=>select(x.dataset.id));if(selected&&apps[selected])select(selected)},e=>{$('apps').innerHTML='<div class="empty">Database access error. Firebase Rules check karo.</div>';console.error(e)})}
function select(id){selected=id;let a=apps[id];if(!a)return;$('sel').textContent=a.name||'—';document.querySelectorAll('.app').forEach(x=>x.classList.toggle('active',x.dataset.id===id));$('detail').innerHTML=`<h2>${esc(a.name||'Applicant')}</h2><div class="phone">📱 ${esc(a.phone||'Not provided')}</div><div class="grid" style="margin-top:15px"><div class="info"><small>BIGO ID</small><b>${esc(a.bigoId||'Not provided')}</b></div><div class="info"><small>LOCATION</small><b>${esc(a.location||'—')}</b></div><div class="info"><small>EXPERIENCE</small><b>${esc(a.experience||'—')}</b></div><div class="info"><small>TARGET</small><b>${esc(a.target||'—')}</b></div></div><div class="msgbox"><b>Application message:</b><br>${esc(a.message||'None')}</div><div class="chat"><div class="ph">💬 Live Chat</div><div id="messages" class="messages"></div><form id="form" class="send"><input id="reply" required placeholder="Reply to applicant…"><button>Send</button></form></div>`;loadChat(id);$('form').onsubmit=async e=>{e.preventDefault();let input=$('reply'),text=input.value.trim();if(!text)return;input.value='';try{await push(ref(db,'chats/'+id+'/messages'),{text,sender:'agency',time:Date.now()})}catch(x){alert('Message send nahi ho paya. Firebase Rules check karo.')}}}
function loadChat(id){if(msgRef)off(msgRef);msgRef=ref(db,'chats/'+id+'/messages');let box=$('messages');box.innerHTML='';$('mc').textContent='0';onChildAdded(msgRef,s=>{let m=s.val()||{},d=document.createElement('div');d.className='msg '+(m.sender==='agency'?'agency':'user');d.textContent=m.text||'';box.appendChild(d);box.scrollTop=box.scrollHeight;$('mc').textContent=box.children.length},e=>console.error(e))}
</script></body></html>
