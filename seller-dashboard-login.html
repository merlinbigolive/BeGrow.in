<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seller Dashboard Login · Merlin Agency</title>
<style>
:root{--green:#19f08a;--green2:#9af7c2;--line:#164a31;--text:#effff5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#0a2115,#020905 48%,#010503);color:var(--text);font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;padding:18px}
.card{width:min(420px,100%);padding:24px;border:1px solid var(--line);border-radius:20px;background:rgba(4,13,8,.97);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.brand{text-align:center;color:var(--green2);font-weight:900;letter-spacing:.08em;font-size:13px}
h1{text-align:center;font-size:25px;margin:10px 0 5px}.sub{text-align:center;color:#9dafa5;font-size:12px;margin-bottom:22px}
label{display:block;color:#b8c9c0;font-size:11px;font-weight:800;margin:13px 0 6px}
input{width:100%;padding:13px;border-radius:11px;border:1px solid #194b33;background:#020805;color:#effff5;outline:none}
button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:11px;background:var(--green);color:#00130a;font-weight:900;cursor:pointer}
.back{display:block;text-align:center;margin-top:16px;color:#9af7c2;text-decoration:none;font-size:12px}

<style>
.signup-divider{display:flex;align-items:center;gap:9px;margin:22px 0 14px;color:#71867b;font-size:10px}
.signup-divider:before,.signup-divider:after{content:"";height:1px;flex:1;background:#164a31}
.signup-btn{display:flex;align-items:center;justify-content:center;width:100%;padding:12px;border:1px solid #19f08a;border-radius:11px;background:rgba(25,240,138,.07);color:#9af7c2;text-decoration:none;font-weight:900;font-size:12px}
.signup-btn:hover{background:rgba(25,240,138,.14)}
</style>

</style>
</head>
<body>
<div class="card">
  <div class="brand">MERLIN AGENCY</div>
  <h1>Seller Dashboard</h1>
  <div class="sub">Secure seller login</div>
  <form>
    <label>SELLER ID / EMAIL</label>
    <input type="text" autocomplete="username" placeholder="Enter Seller ID or Email" required>
    <label>PASSWORD</label>
    <input type="password" autocomplete="current-password" placeholder="Enter Password" required>
    <button type="submit">LOGIN TO DASHBOARD</button>
  </form>

  <div class="signup-divider">NEW SELLER?</div>
  <a class="signup-btn" href="seller-dashboard-signup.html">CREATE SELLER ACCOUNT →</a>

  <a class="back" href="buy-bigo-diamond-with-seller-dashboard-login.html">← Back to Buy BIGO Diamond</a>
</div>
</body>
</html>
